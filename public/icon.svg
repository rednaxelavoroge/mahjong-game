<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5a49" />
      <stop offset="100%" stop-color="#042821" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede3cd" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#021410" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Soft Decorative Circles -->
  <circle cx="90" cy="110" r="70" fill="#166534" opacity="0.3" />
  <circle cx="430" cy="410" r="90" fill="#166534" opacity="0.25" />

  <!-- Mahjong Tile 3D Side -->
  <rect x="136" y="96" width="240" height="320" rx="36" fill="#cbbca0" filter="url(#tileShadow)" />

  <!-- Mahjong Tile Face -->
  <rect x="136" y="86" width="240" height="315" rx="36" fill="url(#tileGrad)" stroke="#dfd4bd" stroke-width="4" />

  <!-- Tile Glossy Highlight -->
  <rect x="156" y="104" width="200" height="24" rx="12" fill="#ffffff" opacity="0.5" />

  <!-- Traditional Green Bamboo / Flower Emblem -->
  <text x="256" y="275" font-size="150" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">🀅</text>

  <!-- Golden corner star -->
  <polygon points="340,116 345,128 358,128 348,136 352,148 340,140 328,148 332,136 322,128 335,128" fill="#eab308" opacity="0.85" />
</svg>
